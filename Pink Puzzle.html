<title>Pink Puzzle</title>

<style>
:root{--bg:#ffe9f0;--bg2:#ffd6e5;--card:#fff7fa;--ink:#7a2e4d;--soft:#c9688f;--pink:#ff9fc0;--pink2:#ffb8d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3a1b29;--bg2:#2b1420;--card:#4a2434;--ink:#ffd9e6;--soft:#ff9fc0}}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:'Fredoka','Trebuchet MS',sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0,var(--bg) 0,var(--bg2) 100%);background-color:var(--bg);display:flex;justify-content:center;overflow-x:hidden}
main{width:100%;max-width:440px;padding:20px 16px 32px;text-align:center}
h1{font-family:'Caveat','Brush Script MT',cursive;font-size:2.6rem;margin:6px 0 0;color:var(--soft);font-weight:600}
p.sub{margin:2px 0 14px;color:var(--ink);opacity:.8}
.bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.chip{flex:1;background:var(--card);border-radius:999px;padding:8px 6px;font-weight:600;box-shadow:0 3px 0 var(--pink2)}
.frame{position:relative;padding:10px;border-radius:26px;background:var(--card);box-shadow:0 6px 0 var(--pink2),0 18px 30px rgba(255,120,170,.25)}
#board{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;background:var(--pink2)}

const bd=document.getElementById('board'),pk=document.getElementById('peek');
let n=3,tiles=[],mv=0,t0=0,timer=null,done=false;
const el={};
function build(){
  bd.innerHTML='';bd.classList.remove('won');
  for(let i=0;i<n*n-1;i++){
    const b=document.createElement('button');b.className='t';b.setAttribute('aria-label','Piece '+(i+1));
    const c=i%n,r=Math.floor(i/n),d=n-1;
    b.style.width=100/n+'%';b.style.height=100/n+'%';
    b.style.backgroundSize=n*100+'% '+n*100+'%';
    b.style.backgroundPosition=(c/d*100)+'% '+(r/d*100)+'%';
    b.onclick=()=>tap(i);bd.appendChild(b);el[i]=b;
  }
}
function place(){
  tiles.forEach((v,pos)=>{if(v===n*n-1)return;const b=el[v];b.style.left=(pos%n)*100/n+'%';b.style.top=Math.floor(pos/n)*100/n+'%'});
}
function nb(pos){const r=Math.floor(pos/n),c=pos%n,o=[];if(r>0)o.push(pos-n);if(r<n-1)o.push(pos+n);if(c>0)o.push(pos-1);if(c<n-1)o.push(pos+1);return o}
function shuffle(){
  done=false;document.getElementById('win').classList.remove('show');
  build();tiles=[...Array(n*n).keys()];
  let e=n*n-1,prev=-1;
  for(let k=0;k<n*n*40;k++){
    const o=nb(e).filter(p=>p!==prev),p=o[Math.floor(Math.random()*o.length)];
    tiles[e]=tiles[p];tiles[p]=n*n-1;prev=e;e=p;
  }
  if(tiles.every((v,i)=>v===i))return shuffle();
  mv=0;t0=0;clearInterval(timer);timer=null;upd();place();
}
function upd(){document.getElementById('mv').textContent='Moves: '+mv;document.getElementById('tm').textContent='Time: '+(t0)+'s'}
function tap(v){
  if(done)return;
  const pos=tiles.indexOf(v),e=tiles.indexOf(n*n-1);
  if(!nb(e).includes(pos))return;
  if(!timer)timer=setInterval(()=>{t0++;upd()},1000);
  tiles[e]=v;tiles[pos]=n*n-1;mv++;upd();place();
  if(tiles.every((x,i)=>x===i))win();
}
function win(){
  done=true;clearInterval(timer);timer=null;
  bd.classList.add('won');
  Object.values(el).forEach(b=>b.style.boxShadow='none');
  // reveal last piece by showing full image
  bd.style.backgroundImage='url('+IMG+')';bd.style.backgroundSize='cover';
  document.getElementById('ws').textContent='Solved in '+mv+' moves and '+t0+' seconds.';
  document.getElementById('win').classList.add('show');
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)for(let i=0;i<24;i++){const h=document.createElement('span');h.className='h';h.textContent=['💗','🌸','💖','✨'][i%4];h.style.left=Math.random()*100+'vw';h.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),5000)}
}
document.getElementById('lv').onclick=e=>{const b=e.target.closest('button');if(!b)return;n=+b.dataset.n;mark();shuffle()};
function mark(){document.querySelectorAll('#lv button').forEach(b=>b.classList.toggle('on',+b.dataset.n===n))}
document.getElementById('sh').onclick=shuffle;
const pb=document.getElementById('pk');
['pointerdown','keydown'].forEach(ev=>pb.addEventListener(ev,e=>{if(ev==='keydown'&&e.key!==' '&&e.key!=='Enter')return;pk.classList.add('on')}));
['pointerup','pointerleave','keyup','blur'].forEach(ev=>pb.addEventListener(ev,()=>pk.classList.remove('on')));
mark();shuffle();
</script></body></html>
